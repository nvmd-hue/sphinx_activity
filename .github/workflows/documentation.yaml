name: Generate and Deploy Documentation

on:
  push:
    branches:
      - main  # ⚠️ Change to 'master' if your main branch is called master

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-docs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build HTML Documentation
        run: |
          cd docs
          make html

      - name: Upload HTML Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/_build/html  # Matches your non-separated setup
